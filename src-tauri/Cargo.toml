[package]
name = "pdftool"
version = "3.5.0"
description = "Combinar, comprimir y OCR de PDFs"
edition = "2021"

[lib]
name = "pdftool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
lopdf = "0.34"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "tiff", "gif", "webp"] }
zune-heic = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
