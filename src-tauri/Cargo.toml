[package]
name = "pdftool"
version = "3.12.1"
description = "Combinar, comprimir y OCR de PDFs"
edition = "2021"

[lib]
name = "pdftool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
lopdf = "0.34"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "tiff", "gif", "webp"] }
zune-heic = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# Las mismas versiones que usa Tauri (wry), para imprimir con WebView2
webview2-com = "0.38"
windows-core = "0.61"
# Automatización de Office (convertir Word, Excel y PowerPoint a PDF)
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
